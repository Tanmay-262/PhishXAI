# PhishXAI feature registry v1.3 (B3 + B5 + B6 value-aware phrases; has_path and has_shortener made value-aware so their sentences always agree with the observed flag - a phrase-only change, model unchanged)
# -------------------------------
# SINGLE SOURCE OF TRUTH for the feature extractor AND the explanation
# translator. The order of `features` entries IS the model feature order
# (deterministic, stable across training and inference).
#
# Rules:
# - All features are computed from the URL string only. NO network access.
# - NO dataset provenance fields (source, url_kind, path_constructed, etc.)
#   may be used as model features.
# - `type` is int or float (no NaN ever; missing scheme / malformed input
#   produces defined values, see computation notes).
# - `phrases.toward_phishing` is used when the feature pushes the
#   prediction toward phishing; `toward_legitimate` when it pushes the
#   other way; null means "no sentence is emitted for this direction".
version: 1
features:
  - name: url_length
    type: int
    computation: "length of the trimmed raw URL string"
    human_name: "URL length"
    phrases:
      toward_phishing: "The URL is {value} characters long, and that length pushed the model's score toward phishing."
      toward_legitimate: "The URL is {value} characters long, which lowered the model's phishing score."

  - name: domain_length
    type: int
    computation: "length of the hostname without port, credentials or brackets"
    human_name: "Domain length"
    phrases:
      toward_phishing: "The domain name is {value} characters long, which contributed to the phishing score."
      toward_legitimate: "The domain name is {value} characters long, which lowered the model's phishing score."

  - name: num_dots
    type: int
    computation: "number of '.' characters in the full URL string"
    human_name: "Number of dots"
    phrases:
      toward_phishing: "The URL has {value} dots, which can help fake a trustworthy domain."
      toward_legitimate: "The URL has {value} dots, without extra subdomain layers."

  - name: num_subdomains
    type: int
    computation: "hostname label count minus registered-domain (eTLD+1) label count, via Public Suffix List; min 0; 0 for IP hosts"
    human_name: "Number of subdomains"
    phrases:
      toward_phishing: "The URL nests the real site under {value} subdomain layer(s)."
      toward_legitimate: "The link sits directly on the main domain ({value} extra subdomain layer(s))."

  - name: num_hyphens
    type: int
    computation: "number of '-' characters in the hostname"
    human_name: "Hyphens in the domain"
    phrases:
      toward_phishing: "The domain name uses {value} hyphen(s), a common phishing trick."
      toward_legitimate: "The domain name uses {value} hyphen(s)."

  - name: num_digits
    type: int
    computation: "number of digit characters in the full URL string"
    human_name: "Digits in the URL"
    phrases:
      toward_phishing: "The URL contains {value} digit(s), which can help disguise a domain."
      toward_legitimate: "The URL contains {value} digit(s)."

  - name: digit_in_domain_ratio
    type: float
    computation: "digits in hostname / hostname length (0.0 when host is empty or an IP)"
    human_name: "Digit share of the domain"
    phrases:
      toward_phishing: "The digit share of the domain is {value}, which contributed to the phishing score."
      toward_legitimate: "The digit share of the domain is {value}, which lowered the model's phishing score."

  - name: num_special_chars
    type: int
    computation: "characters in the URL outside the normal set [a-zA-Z0-9 and - . _ ~ / : ? & = + % # @]"
    human_name: "Unusual special characters"
    phrases:
      toward_phishing: "The URL contains {value} unusual special character(s), which raised the model's phishing score."
      toward_legitimate: "The URL contains {value} unusual special character(s), which lowered the model's phishing score."

  - name: has_ip_host
    type: int
    computation: "1 if hostname is an IPv4 or IPv6 literal, else 0"
    human_name: "IP address as the host"
    phrases:
      toward_phishing: "The site uses a raw IP address instead of a domain name."
      toward_legitimate: "The host is an ordinary domain name, not a raw IP address."

  - name: has_https
    type: int
    computation: "1 if scheme is https, else 0"
    human_name: "Encrypted connection (HTTPS)"
    phrases:
      toward_phishing: "The URL has no HTTPS encryption, which the model weighs toward phishing."
      toward_legitimate: "The site uses HTTPS encryption, which the model weighs toward legitimate."

  - name: has_port
    type: int
    computation: "1 if the URL states an explicit non-default port (80/443 ignored), else 0"
    human_name: "Explicit port number"
    phrases:
      toward_phishing: "The URL points at an unusual port number."
      toward_legitimate: "No unusual port number is used in the URL."

  - name: has_at_symbol
    type: int
    computation: "1 if '@' appears in the network location (user:pass@host pattern), else 0"
    human_name: "@ symbol in the URL"
    phrases:
      toward_phishing: "The @ symbol can hide the real destination of the link."
      toward_legitimate: "The URL contains no '@' symbol."

  - name: has_shortener
    type: int
    computation: "1 if registered domain is in the static shortener list (bit.ly, tinyurl.com, goo.gl, t.co, is.gd, ow.ly, buff.ly, cutt.ly, cutt.us, rebrand.ly, shrinkurl.com), else 0"
    human_name: "URL shortening service"
    phrases:
      toward_phishing: "The URL's shortening-service flag is {value} (1 = a known shortener), which pushed the model's score toward phishing."
      toward_legitimate: "The URL's shortening-service flag is {value} (1 = a known shortener), which lowered the model's phishing score."

  - name: path_length
    type: int
    computation: "length of the URL path component"
    human_name: "Path length"
    phrases:
      toward_phishing: "The URL path is {value} characters long, which can hide the real destination."
      toward_legitimate: "The URL path is {value} characters long, typical of ordinary pages."

  - name: has_path
    type: int
    computation: "1 if the path is non-empty and not just '/', else 0"
    human_name: "Has a path"
    phrases:
      toward_phishing: "The URL's has_path flag is {value} (1 = has a path beyond just '/'), which pushed the model's score toward phishing."
      toward_legitimate: "The URL's has_path flag is {value} (1 = has a path beyond just '/'), which lowered the model's phishing score."

  - name: query_length
    type: int
    computation: "length of the URL query string"
    human_name: "Query string length"
    phrases:
      toward_phishing: "The URL query string is {value} characters long, adding extra parameters to the phishing score."
      toward_legitimate: "The URL query string is {value} characters long."

  - name: num_url_params
    type: int
    computation: "number of top-level '&' separated query parameters"
    human_name: "Number of URL parameters"
    phrases:
      toward_phishing: "The URL stacks {value} parameters, which is atypical for normal pages and raised the phishing score."
      toward_legitimate: "The URL stacks {value} parameters."

  - name: percent_encoded_count
    type: int
    computation: "count of %XX byte-encoding sequences in the URL"
    human_name: "Percent-encoding"
    phrases:
      toward_phishing: "The URL uses {value} percent-encoding sequence(s), which can hide its real content."
      toward_legitimate: "The URL uses {value} percent-encoding sequence(s)."

  - name: has_suspicious_keyword
    type: int
    computation: "1 if the lowercased URL contains any keyword: login, log-in, signin, sign-in, verify, verification, secure, security, account, payment, bank, password, confirm, support, update, prize, claim, alert, recover, unlock, suspended, disabled; else 0"
    human_name: "Suspicious keyword"
    phrases:
      toward_phishing: "The link mentions words like 'verify' or 'login' that phishing pages often use."
      toward_legitimate: "The link does not use typical phishing words like 'verify', 'secure', or 'login'."
